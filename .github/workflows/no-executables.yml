name: Block tracked executables

on:
  push:
  pull_request:

jobs:
  check-executables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for tracked executable files
        run: |
          set -e
          execs=$(git ls-files --stage | awk '$1 == "100755" {print $4}') || true
          if [ -n "$execs" ]; then
            echo "Error: tracked executable files found:";
            echo "$execs";
            exit 1
          fi
          echo "No tracked executable files."
